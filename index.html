<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Tindahan</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home">
      <h2>Welcome to Tindahan</h2>
      <p>Browse our very few but very nice selection of gadgets, books, and clothing.</p>
    </section>

    <section id="products">
      <h2>Our Products</h2>
      <div class="filters">
        <button data-category="all">All</button>
        <button data-category="gadgets">Gadgets</button>
        <button data-category="books">Books</button>
        <button data-category="clothing">Clothing</button>
      </div>
      <div id="productGrid"></div>
    </section>

    <section id="contact">
      <h2>Contact Us</h2>
      <form id="contactForm">
        <input type="text" id="name" placeholder="Your Name">
        <input type="text" id="email" placeholder="Your Email">
        <textarea id="message" rows="4" placeholder="Your Message"></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Tindahan. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
